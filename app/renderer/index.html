<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Midorii</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #131722;
            }
            :root {
                /* The app's own title bar (app-topbar) — mirrors TITLEBAR_HEIGHT in
                   app/electron/titlebar.js, the last remaining native-frame concern. */
                --app-topbar-h: 40px;
            }
            #app-topbar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: var(--app-topbar-h);
                /* Frameless window (titleBarStyle 'hidden', no overlay — see
                   app/electron/main.js): this row IS the title bar, so it is the
                   window's only drag handle. AppTopbar opts its own buttons back out. */
                -webkit-app-region: drag;
            }
            #chart,
            #replay-root,
            #backtest-root,
            #analysis-root,
            #strategies-root,
            #settings-root,
            #bot-root {
                position: absolute;
                top: var(--app-topbar-h);
                right: 0;
                bottom: 0;
                left: 0;
            }
            .midorii-dummy-view {
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--vela-fg-muted, #868a96);
                font: 13px/1.5 var(--vela-font, sans-serif);
                letter-spacing: 0.02em;
            }
            /* `[hidden]` and `.midorii-dummy-view` are both author-stylesheet rules of
               equal specificity — without this, `display: flex` above wins the cascade
               by source order and all three dummy views render stacked regardless of
               the `hidden` attribute that is supposed to keep only one tab's view showing. */
            .midorii-dummy-view[hidden] {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="app-topbar"></div>
        <div id="chart"></div>
        <div id="replay-root" hidden></div>
        <div id="backtest-root" hidden></div>
        <div id="analysis-root" hidden></div>
        <div id="strategies-root" hidden></div>
        <div id="settings-root" hidden></div>
        <div id="bot-root" class="midorii-dummy-view" hidden>Bot — coming soon</div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
