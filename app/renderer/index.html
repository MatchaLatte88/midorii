<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Midorii</title>
        <link rel="icon" type="image/png" href="./assets/midorii-logo.png" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #131722;
            }
            :root {
                /* The app's own title bar (app-topbar) — mirrors TITLEBAR_HEIGHT in
                   app/electron/titlebar.js, the last remaining native-frame concern. */
                --app-topbar-h: 40px;
            }
            #app-topbar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: var(--app-topbar-h);
                /* Frameless window (titleBarStyle 'hidden', no overlay — see
                   app/electron/main.js): this row IS the title bar, so it is the
                   window's only drag handle. AppTopbar opts its own buttons back out. */
                -webkit-app-region: drag;
            }
            #chart,
            #replay-root,
            #backtest-root,
            #patterns-root,
            #analysis-root,
            #strategies-root,
            #settings-root,
            #bot-root {
                position: absolute;
                top: var(--app-topbar-h);
                right: 0;
                bottom: 0;
                left: 0;
            }
        </style>
    </head>
    <body>
        <div id="app-topbar"></div>
        <div id="chart"></div>
        <div id="replay-root" hidden></div>
        <div id="backtest-root" hidden></div>
        <div id="patterns-root" hidden></div>
        <div id="analysis-root" hidden></div>
        <div id="strategies-root" hidden></div>
        <div id="settings-root" hidden></div>
        <div id="bot-root" hidden></div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
